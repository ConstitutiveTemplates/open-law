name: adapter-health

# Weekly live-probe of every jurisdiction adapter: one cheap representative
# fetch per adapter against its official channel. The probe list is the
# adapter registry itself (``tests/test_live.py`` parametrizes over
# ``ADAPTERS``), so a new source is covered the moment it is registered —
# there is no second hand-written list to forget. The test suite is fully
# offline, so upstream API breakage would otherwise go unnoticed until a
# user hits it. On a finding it opens or updates ONE issue per run (reuses
# any open 'adapter-health' issue). When every probe passes it closes any
# open 'adapter-health' issue with an "adapter health resolved" comment.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The live probes are opt-in: without this the suite skips them.
      OPEN_LAW_LIVE: "1"
      # Key-gated adapters read credentials from the environment; when the
      # secret is unset the kr probe is skipped (and the skip shows up in
      # the report with its reason, so the gap stays visible).
      LAW_KR_OC: ${{ secrets.LAW_KR_OC }}
      # The fetcher refuses live requests under the placeholder contact, so
      # every probe fails until the FETCHER_CONTACT repository variable holds
      # an address the probed sites' operators can reach.
      FETCHER_CONTACT: ${{ vars.FETCHER_CONTACT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Adapter registry under test
        run: uv run --locked open-law sources | tee health.txt

      - name: Probe every registered adapter
        run: |
          # ``-rs`` prints each skip with its reason (kr without a secret,
          # a registry entry with no live id) so the report shows what was
          # not probed, not merely what passed.
          if uv run --locked pytest -m live -q -rs >> health.txt 2>&1; then
            echo "all registered adapters probed OK" >> health.txt
          else
            echo "ADAPTER HEALTH: one or more probes failed (see above)" >> health.txt
            echo "FOUND=1" >> "$GITHUB_ENV"
          fi

      - name: Show probe report
        if: always()
        run: cat health.txt

      - name: Ensure adapter-health label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create adapter-health --description "Weekly adapter-health probe failures" --color d73a4a 2>/dev/null || true

      - name: Open or update adapter-health issue
        if: env.FOUND == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="adapter-health"
          body=$(cat health.txt)
          issue=$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty' | head -1)
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --title "Adapter health report $(date -u +%Y-%m-%d)" --body "$body"
          else
            gh issue create --title "Adapter health report $(date -u +%Y-%m-%d)" --label "$label" --body "$body"
          fi

      - name: Close adapter-health issue on clean report
        if: env.FOUND != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="adapter-health"
          issue=$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty' | head -1)
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "adapter health resolved"
          else
            echo "no open $label issue; nothing to close"
          fi
