[project]
site_url = "https://politeuma.github.io/open-law/main/"
site_name = "open-law"
site_description = "Scrape and consolidate legislation from around the world"
site_author = "kashi-x"

repo_url = "https://github.com/politeuma/open-law"
repo_name = "politeuma/open-law"
edit_uri = "edit/main/docs/"

copyright = 'Maintained by <a href="https://github.com/politeuma/open-law">kashi-x</a>.'

nav = [
  { "Home" = "index.md" },
  { "How-to" = [
      { "Fetch laws from sources" = "how-to/use-sources.md" },
      { "Compare coverage across countries" = "how-to/compare-coverage.md" },
      { "Add your legal expertise" = "how-to/add-expert-knowledge.md" },
  ] },
  { "Explanations" = [
      { "OSS landscape evaluation" = "explanations/oss-evaluation.md" },
      { "Asia coverage map" = "explanations/asia-coverage.md" },
  ] },
  { "Modules" = "modules.md" },
]

[project.theme]
name = "material"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins]
mkdocstrings = { default_handler = "python", handlers = { python = { paths = ["src"] } } }
search = {}

[project.markdown_extensions]
admonition = {}
toc = { permalink = true }
pymdownx.superfences = {}
